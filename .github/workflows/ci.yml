name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      # Switch to `npm ci` once package-lock.json has been regenerated and committed
      # after the dependency changes (helmet, zod, multer 2).
      - run: npm install --no-audit --no-fund
      - run: npm test
        env:
          NODE_ENV: test

  mobile-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: 17
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet workload install maui-android
      # Build Android only: iOS/MacCatalyst need macOS runners.
      - run: dotnet build UNIVAST.Mobile/UNIVAST.Mobile.csproj -f net10.0-android -c Release -p:TargetFrameworks=net10.0-android
