# Local development stack: API + MongoDB.
#   docker compose up --build
# The API is then reachable at http://localhost:5000 (and on your LAN IP for a phone).
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/univast
      # Development only — set a real secret in production.
      JWT_SECRET: dev-only-change-me
    env_file:
      - path: ./backend/.env
        required: false

volumes:
  mongo-data:
