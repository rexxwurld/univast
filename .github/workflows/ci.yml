name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      # Switch to `npm ci` once package-lock.json has been regenerated and committed
      # after the dependency changes (helmet, zod, multer 2).
      - run: npm install --no-audit --no-fund
      # mongodb-memory-server downloads a MongoDB binary on first run; cache it between runs.
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-v1
      - run: npm test -- --ci
        env:
          NODE_ENV: test
          MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.mongodb-binaries
          # Known-good binary for ubuntu-latest runners.
          MONGOMS_DISTRO: ubuntu-22.04

  mobile-tests:
    # Plain .NET unit tests (token refresh/retry handler, error unwrapping, DTOs). No MAUI workload needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test UNIVAST.Mobile.Tests/UNIVAST.Mobile.Tests.csproj --configuration Release

# The signed Android build lives in android-apk.yml.
